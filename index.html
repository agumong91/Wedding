<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>모바일 청첩장</title>

<!-- ============================================================
     카카오톡/문자 등 링크 공유 시 나오는 미리보기(썸네일·제목·설명)
     ⚠️ 이 태그들은 반드시 여기(정적 HTML)에 있어야 합니다.
        카카오톡이 링크를 미리 볼 때는 script.js를 실행하지 않고
        이 페이지의 <head>만 그대로 읽어가기 때문에, JS로 나중에
        추가하는 방식(og:image 등)은 인식되지 않습니다.

     아래 og:url / og:image는 https://github.com/agumong91/Wedding 저장소를
     GitHub Pages로 배포했을 때의 기본 주소(https://agumong91.github.io/Wedding/)로
     맞춰뒀습니다. 실제로 미리보기가 뜨려면 아래 조건이 모두 맞아야 해요.

       1) 저장소가 Public이어야 합니다 (Private면 카카오 크롤러가 접근 불가).
          단, Public이 어렵다면 Private 상태에서도 GitHub Pages 배포 자체는
          별개 문제이니 "Settings → Pages"에서 배포 여부만 먼저 확인하세요.
       2) 저장소 Settings → Pages 에서 Source가 이 코드가 있는 브랜치
          (보통 main)로 설정되어 "Your site is live at ..." 문구가 떠야 합니다.
       3) 사이트 주소가 https://agumong91.github.io/Wedding/ 가 아니라면
          (예: 커스텀 도메인을 쓰는 경우) 아래 og:url / og:image 값을
          실제 주소로 바꿔주세요.
       4) 미리보기 이미지는 images/og/1.jpg 파일명 그대로 저장 (jpg 고정,
          1200x630px 권장 비율로 준비하면 카카오톡/페이스북 등에서
          잘리지 않고 가장 깔끔하게 보입니다).
       5) config.js의 meta.title / meta.description을 바꿨다면
          아래 og:title / og:description도 동일하게 맞춰주세요.

     ⚠️ og:description은 "줄"이 아니라 "전체 글자수" 기준으로 잘립니다.
        실측 결과 대략 35자를 넘으면 뒷부분이 "..."으로 잘렸습니다.
        \n으로 줄바꿈을 넣어도 미리보기에서는 그냥 이어서 표시되고
        전체 글자수 제한은 그대로 적용되니, 문구는 전체 30자 안팎으로
        짧게 유지해주세요.

     ⚠️ 이 og:image 방식은 카카오톡에서 항상 "작은 정사각형 썸네일"로만
        보입니다 (카카오톡 자체 미리보기 UI의 고정된 형태라 크게 만들 수
        없어요). 사진을 큼직한 카드 형태로 보이게 하려면 아래 "카카오톡
        공유하기(선택)" SDK를 설정해서 공유 버튼을 사용해야 합니다.

     수정 후에도 카카오는 이전 미리보기를 한동안 캐싱합니다.
     https://developers.kakao.com/tool/clear/og 에서 이 주소를 넣고
     캐시를 지우면 새 미리보기가 바로 반영됩니다.
============================================================ -->
<meta property="og:title" content="지원❤유정 결혼합니다." />
<meta property="og:description" content="서로의 쉼터가 된 두 사람의 시작을 축복해 주세요." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://agumong91.github.io/Wedding/" />
<meta property="og:image" content="https://agumong91.github.io/Wedding/images/og/1.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- 폰트: 한글 명조/고운돋움 + 영문 Marcellus -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&family=Marcellus&display=swap" rel="stylesheet" />

<!-- 스타일시트 -->
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 눈 캔버스 -->
  <canvas id="snow"></canvas>

  <!-- 배경 음악 -->
  <audio id="bgm" loop preload="auto"></audio>
  <button id="musicToggle" class="music-toggle" aria-label="음악 켜기/끄기">♪</button>
  
  <!-- 초대장 열기(커튼) -->
  <div id="curtain">
    <div class="curtain-en">The Wedding of</div>
    <div class="curtain-names" id="curtainNames">신랑 · 신부</div>
    <div class="curtain-sub" id="curtainSub">2026. 11. 14 SAT</div>
    <button class="curtain-btn" id="openBtn">초대장 열기</button>
  </div>

  <div class="frame" id="frame">

    <!-- 히어로 -->
    <section class="hero">
      <div class="hero-photo" id="heroPhoto">
        <div class="ph-flake">❄</div>
        <div class="hero-overlay">
          <div class="hero-en" id="heroEn">GROOM &amp; BRIDE</div>
          <div class="hero-names" id="heroNames">신랑 · 신부</div>
        </div>
      </div>
      <div class="hero-meta">
        <div class="hero-date" id="heroDate"></div>
        <div class="hero-place" id="heroPlace"></div>
      </div>
    </section>

    <!-- 인사말 -->
    <section class="reveal">
      <div class="eyebrow">Invitation</div>
      <h2 class="s-title" id="greetTitle"></h2>
      <div class="divider"></div>
      <p class="greet-body pre-line" id="greetBody" style="margin-top:26px;"></p>
      <div class="parents" id="parents"></div>
    </section>

    <!-- 우리의 이야기 -->
    <section class="reveal">
      <div class="eyebrow">Our Story</div>
      <h2 class="s-title" id="storyTitle"></h2>
      <div class="divider"></div>
      <p class="story-body pre-line" id="storyBody" style="margin-top:26px;"></p>

      <!-- 신랑 이야기 (images/groom/ 폴더에 사진이 없으면 자동으로 숨겨집니다) -->
      <div class="story-chapter align-left" id="groomChapter">
        <div class="chapter-label">GROOM</div>
        <h3 class="chapter-title" id="groomChapterTitle"></h3>
        <p class="chapter-text pre-line" id="groomChapterText"></p>
        <div class="chapter-strip" id="groomStrip"></div>
      </div>

      <!-- 신부 이야기 (images/bride/ 폴더에 사진이 없으면 자동으로 숨겨집니다) -->
      <div class="story-chapter align-right" id="brideChapter">
        <div class="chapter-label">BRIDE</div>
        <h3 class="chapter-title" id="brideChapterTitle"></h3>
        <p class="chapter-text pre-line" id="brideChapterText"></p>
        <div class="chapter-strip" id="brideStrip"></div>
      </div>

      <!-- 우리, 함께 (기존 images/story/ 폴더의 커플 사진) -->
      <div class="story-chapter align-center" id="togetherChapter">
        <div class="chapter-label">TOGETHER</div>
        <h3 class="chapter-title" id="togetherChapterTitle"></h3>
        <div class="story-imgs" id="storyImgs"></div>
      </div>
    </section>

    <!-- 캘린더 / 카운트다운 -->
    <section class="reveal">
      <div class="eyebrow">The Date</div>
      <h2 class="s-title">예식 안내</h2>
      <div class="divider"></div>
      <div class="cal-wrap" style="margin-top:26px;">
        <div class="panel cal">
          <div class="cal-head" id="calHead"></div>
          <table class="calendar" id="calTable"></table>
        </div>
        <div class="countdown" id="countdown"></div>
        <div class="cd-line" id="cdLine"></div>
      </div>
    </section>

    <!-- 갤러리 -->
    <section class="reveal">
      <div class="eyebrow">Gallery</div>
      <h2 class="s-title">사진첩</h2>
      <div class="divider"></div>
      <div class="gallery-wrap" style="margin-top:26px;">
        <div class="gallery" id="gallery"></div>
        <div class="gallery-count" id="galleryCount"></div>
        <div class="gallery-hint">사진을 좌우로 넘기고, 눌러서 크게 볼 수 있어요</div>
      </div>
    </section>

    <!-- 오시는 길 -->
    <section class="reveal">
      <div class="eyebrow">Location</div>
      <h2 class="s-title">오시는 길</h2>
      <div class="divider"></div>
      <div class="panel loc-card" style="margin-top:26px;">
        <div class="loc-venue" id="locVenue"></div>
        <div class="loc-hall" id="locHall"></div>
        <div class="loc-addr" id="locAddr"></div>
        <div class="loc-tel" id="locTel"></div>
        <div class="map-img" id="mapImg"><span class="ph">약도 이미지 (images/location/1.jpg)</span></div>
        <div class="map-btns" id="mapBtns"></div>
      </div>
    </section>

    <!-- 마음 전하실 곳 -->
    <section class="reveal">
      <div class="eyebrow">With Heart</div>
      <h2 class="s-title">마음 전하실 곳</h2>
      <div class="divider"></div>
      <p class="acc-desc" style="margin-top:26px;">참석이 어려우신 분들을 위해<br>계좌번호를 안내드립니다.</p>
      <div id="accGroom" class="acc-group"></div>
      <div id="accBride" class="acc-group"></div>
    </section>

    <!-- 영상 (마음 전하실 곳 다음) -->
    <section class="reveal" id="videoSection" style="display:none;">
      <div class="eyebrow">Movie</div>
      <h2 class="s-title" id="videoTitle"></h2>
      <div class="divider"></div>
      <p class="video-caption pre-line" id="videoCaption" style="margin-top:26px;"></p>
      <div class="video-frame" id="videoFrame">
        <img id="videoThumb" alt="영상 썸네일" />
        <div class="video-play"><span></span></div>
      </div>
    </section>

    <!-- 푸터 -->
    <section class="footer reveal">
      <button class="share-btn" id="shareBtn">🔗 링크 복사하기</button>
      <div class="foot-flake">❄</div>
      <div class="foot-names" id="footNames"></div>
      <div class="foot-date" id="footDate"></div>
    </section>

  </div>

  <!-- 라이트박스 -->
  <div id="lightbox">
    <div class="lb-close" id="lbClose">✕</div>
    <div class="lb-nav lb-prev" id="lbPrev"></div>
    <div class="lb-nav lb-next" id="lbNext"></div>
    <img id="lbImg" alt="" />
    <div class="lb-count" id="lbCount"></div>
  </div>

  <div id="toast"></div>

  <!-- ============================================================
       카카오톡 공유하기(선택 기능)
       위쪽 og:image는 카카오톡 미리보기에서 항상 작은 정사각형 썸네일로만
       보입니다. 공유 버튼을 눌렀을 때 큼직한 이미지 카드로 카카오톡 공유가
       되게 하려면 아래 3단계를 따라 이 스크립트를 켜주세요.

         1) https://developers.kakao.com 에서 무료로 애플리케이션 생성
         2) [내 애플리케이션] → [앱 키]에서 "JavaScript 키" 복사 →
            config.js의 kakao.jsKey 값에 붙여넣기
         3) [내 애플리케이션] → [플랫폼] → Web 플랫폼에
            https://agumong91.github.io 도메인 등록
            (그리고 [제품 설정] → [카카오 로그인]이 아니라
             [카카오톡 공유]가 활성화되어 있는지 확인)

       그 다음 아래 주석을 해제하고, {버전}과 {인테그리티값}을
       https://developers.kakao.com/docs/latest/ko/javascript/download
       페이지에 나오는 값 그대로 복사해서 바꿔주세요.
       (버전을 잘못 넣으면 이 스크립트만 조용히 로드되지 않을 뿐,
        나머지 청첩장은 평소처럼 정상 작동합니다.)

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/{버전}/kakao.min.js"
   integrity="{인테그리티값}" crossorigin="anonymous"></script>
  ============================================================ -->

  <!-- 스크립트: config.js가 script.js보다 먼저 로드되어야 합니다 -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
